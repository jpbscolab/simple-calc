<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シンプル電卓</title>
  <style>
    :root {
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f5f5f5;
      color: #222;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #ffffff, #e8edf5);
    }

    .calculator {
      width: min(90vw, 360px);
      padding: 1.5rem;
      border-radius: 18px;
      background: #1f1f1f;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      display: grid;
      gap: 1rem;
    }

    .display {
      min-height: 3.75rem;
      padding: 0.75rem 1rem;
      background: #111;
      border-radius: 12px;
      text-align: right;
      color: #fdfdfd;
      font-size: 1.8rem;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }

    button {
      padding: 0.9rem;
      font-size: 1.25rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      background: #2e2e2e;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .span-2 {
      grid-column: span 2;
    }

    .operator {
      background: #ff8c42;
    }

    .clear {
      background: #d9534f;
    }

    .equals {
      background: linear-gradient(135deg, #6a5acd, #6ad1ff);
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="電卓">
    <output class="display" id="display" aria-live="polite">0</output>
    <div class="buttons">
      <button class="clear" data-action="clear">AC</button>
      <button data-action="delete">DEL</button>
      <button data-operator="%">%</button>
      <button class="operator" data-operator="/">÷</button>

      <button data-number>7</button>
      <button data-number>8</button>
      <button data-number>9</button>
      <button class="operator" data-operator="*">×</button>

      <button data-number>4</button>
      <button data-number>5</button>
      <button data-number>6</button>
      <button class="operator" data-operator="-">−</button>

      <button data-number>1</button>
      <button data-number>2</button>
      <button data-number>3</button>
      <button class="operator" data-operator="+">＋</button>

      <button class="span-2" data-number>0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">＝</button>
    </div>
  </main>

  <script>
    const display = document.getElementById("display");
    let currentValue = "0";
    let previousValue = null;
    let operator = null;

    const updateDisplay = (value) => {
      display.textContent = value;
    };

    const handleNumber = (num) => {
      if (currentValue === "0" || operator && previousValue === null) {
        currentValue = num;
      } else {
        currentValue += num;
      }
      updateDisplay(currentValue);
    };

    const handleOperator = (op) => {
      if (operator && previousValue !== null) {
        compute();
      } else {
        previousValue = parseFloat(currentValue);
        currentValue = "0";
      }
      operator = op;
    };

    const handleDecimal = () => {
      if (!currentValue.includes(".")) {
        currentValue += ".";
        updateDisplay(currentValue);
      }
    };

    const clearAll = () => {
      currentValue = "0";
      previousValue = null;
      operator = null;
      updateDisplay(currentValue);
    };

    const deleteLast = () => {
      if (currentValue.length > 1) {
        currentValue = currentValue.slice(0, -1);
      } else {
        currentValue = "0";
      }
      updateDisplay(currentValue);
    };

    const compute = () => {
      if (operator === null || previousValue === null) return;
      const currentNumber = parseFloat(currentValue);
      let result;

      switch (operator) {
        case "+":
          result = previousValue + currentNumber;
          break;
        case "-":
          result = previousValue - currentNumber;
          break;
        case "*":
          result = previousValue * currentNumber;
          break;
        case "/":
          if (currentNumber === 0) {
            updateDisplay("エラー");
            currentValue = "0";
            previousValue = null;
            operator = null;
            return;
          }
          result = previousValue / currentNumber;
          break;
        case "%":
          result = previousValue % currentNumber;
          break;
        default:
          return;
      }

      currentValue = String(result);
      updateDisplay(currentValue);
      previousValue = null;
      operator = null;
    };

    document.querySelector(".buttons").addEventListener("click", (event) => {
      const target = event.target;
      if (target.matches("button")) {
        const number = target.textContent.trim();
        const op = target.dataset.operator;
        const action = target.dataset.action;

        if (target.hasAttribute("data-number")) {
          handleNumber(number);
        } else if (op) {
          handleOperator(op);
        } else if (action === "decimal") {
          handleDecimal();
        } else if (action === "clear") {
          clearAll();
        } else if (action === "delete") {
          deleteLast();
        } else if (action === "equals") {
          if (operator === null) {
            previousValue = parseFloat(currentValue);
          } else {
            compute();
          }
        }
      }
    });
  </script>
</body>
</html>
